<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #111">
    <h2>Proposta recusada</h2>
    <p th:text="'Olá, ' + ${name} + '!'">Olá!</p>
    <p th:text="${clientFirstName} + ' recusou a versão ' + ${version} + ' da sua proposta.'">
      Proposta recusada.
    </p>
    <p th:if="${reason}" th:text="'Motivo: ' + ${reason}">Motivo.</p>
    <p style="color: #666; font-size: 12px">
      Equipe Vanep.
    </p>
  </body>
</html>
