<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #111">
    <h2>Você recebeu uma proposta</h2>
    <p th:text="'Olá, ' + ${name} + '!'">Olá!</p>
    <p th:text="${driverName} + ' enviou a versão ' + ${version} + ' da proposta de transporte para ' + ${dependents} + '.'">
      Proposta recebida.
    </p>
    <p th:text="'Valor total: ' + ${totalAmount} + ', em ' + ${installments} + ' parcelas.'">Valor.</p>
    <p th:text="'A proposta vale até ' + ${validUntil} + '.'">Validade.</p>
    <p>Acesse o aplicativo Vanep para aceitar, recusar ou pedir um ajuste.</p>
    <p style="color: #666; font-size: 12px">
      Equipe Vanep.
    </p>
  </body>
</html>
