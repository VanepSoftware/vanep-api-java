services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      # Só no loopback: o Docker ignora o UFW, e 0.0.0.0 deixaria o banco aberto no IP público
      # da VPS. O profile local conecta em 127.0.0.1; de fora, use túnel SSH.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - vanep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Só dev: sobe com o profile "mailpit" (COMPOSE_PROFILES no .env ou via Makefile).
  # Produção não ativa o profile e usa SMTP real (MAIL_* no .env).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mailpit"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  vanep:
    build:
      context: .
      dockerfile: Dockerfile
    # Dev builda localmente (vanep-api:local). Produção usa a imagem que o CD publica
    # no GHCR: VANEP_IMAGE no .env do servidor + `docker compose up --no-build`.
    image: ${VANEP_IMAGE:-vanep-api:local}
    restart: unless-stopped
    env_file: .env
    ports:
      # Em produção a API só é alcançada pelo cloudflared, que roda no host. Publicar
      # em 0.0.0.0 deixaria a porta aberta no IP público, contornando a Cloudflare e
      # entregando o header de IP real a qualquer cliente direto.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT}:8080"
    environment:
      # Dev usa o profile "docker". Produção define SPRING_PROFILES_ACTIVE=docker,prod
      # no .env do servidor (ativa application-prod: cookie secure, swagger off, etc.).
      # NÃO fixe "docker,prod" aqui: quebraria o login local (cookie.secure exige HTTPS).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_HOST: postgres
      # Mail vem do .env (env_file). Sem MAIL_HOST definido, o profile docker usa
      # mailpit como default (dev). Em produção, defina MAIL_* no .env (SMTP real).
      JAVA_OPTS: "${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vanep-postgres-data:
