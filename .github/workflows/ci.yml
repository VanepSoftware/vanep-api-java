name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 2 commits: HEAD^1 é a main antes deste PR/merge, a base da checagem das migrations.
          fetch-depth: 2

      - name: Numeração das migrations (sem versão repetida nem atrás da main)
        run: bash scripts/check-migrations.sh HEAD^1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Lint + testes + JaCoCo (Spotless + cobertura ≥ 75% linhas)
        run: chmod +x mvnw && ./mvnw verify -B

      - name: Upload relatório JaCoCo (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html
          path: target/site/jacoco/
