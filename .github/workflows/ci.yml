name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detecta mudanças de código
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Feito em bash de proposito: este repo restringe Actions a uma allowlist
      # (github_owned + docker/* + appleboy/ssh-action), entao dorny/paths-filter
      # daria startup_failure. Frontend e mobile usam a action.
      - name: Filtra caminhos
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif git rev-parse --quiet --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            # Branch nova ou force-push: sem base confiavel, roda a CI inteira.
            echo "Sem base para comparar — tratando como mudanca de codigo."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$range")"
          echo "Arquivos alterados:"
          echo "${files:-(nenhum)}"

          if [ -z "$files" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # docs-only = todo arquivo alterado e' .md ou esta em docs/ ou openspec/.
          # Testa a saida do grep, nao o exit code de -v: nem toda implementacao
          # de grep concorda sobre o status de saida com -v.
          code_files="$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/|^openspec/)' || true)"

          if [ -n "$code_files" ]; then
            echo "Mudou codigo:"
            echo "$code_files"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Somente documentacao."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only PR — skip
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes — skipping CI"

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 25
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Lint + testes + JaCoCo (Spotless + cobertura ≥ 75% linhas)
        if: needs.changes.outputs.code == 'true'
        run: chmod +x mvnw && ./mvnw verify -B

      - name: Upload relatório JaCoCo (HTML)
        uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: jacoco-html
          path: target/site/jacoco/
